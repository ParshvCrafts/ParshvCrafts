# Regenerates the statistics cards in assets/ and commits them back.
#
# The cards used to come from the public github-readme-stats, streak-stats and
# github-profile-trophy instances. Two of those started returning HTTP 402 when
# their shared Vercel quota ran out, which turned the whole section of the
# README into broken images. Generating them here removes that dependency.
#
# PROFILE_TOKEN is optional. Without it the job falls back to the automatic
# GITHUB_TOKEN, which can only see public activity, so the totals come out
# lower. With a read-only personal access token in repository secrets, private
# contributions are counted too. Either way the job succeeds, and if the token
# ever expires the committed SVGs simply stop refreshing rather than breaking.

name: Generate Stats Cards

on:
  schedule:
    - cron: "17 5,17 * * *"
  push:
    branches: [main]
    paths:
      - scripts/cards.py
      - .github/workflows/cards.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py ${{ github.repository_owner }}

      - name: Commit any change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.svg
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "Refresh statistics cards"
            git push
          fi
